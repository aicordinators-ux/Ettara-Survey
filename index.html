<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#7A2E1D">
<title>عطارة - سيرفي المحلات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF5EA;
    --paper-2:#F1E8D6;
    --ink:#2B1B12;
    --ink-soft:#6B5847;
    --saffron:#C6861F;
    --saffron-dark:#9C6A15;
    --paprika:#A23B2E;
    --olive:#5C7A3D;
    --line:#E2D3B4;
    --card:#FFFFFF;
    --shadow: 0 1px 2px rgba(43,27,18,0.06), 0 4px 14px rgba(43,27,18,0.06);
    --radius: 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Cairo',sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  #app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:78px;}
  .hidden{display:none !important;}

  /* ---------- top texture header ---------- */
  .brandbar{
    background: linear-gradient(135deg, #7A2E1D 0%, #A23B2E 55%, #C6861F 130%);
    color:#FFF6E9;
    padding:22px 20px 26px;
    position:relative;
    overflow:hidden;
  }
  .brandbar::after{
    content:"";
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(255,246,233,0.14) 1.5px, transparent 1.5px);
    background-size: 14px 14px;
    opacity:.5;
  }
  .brandbar .row{position:relative; display:flex; justify-content:space-between; align-items:flex-start;}
  .brandbar h1{margin:0; font-size:20px; font-weight:800; letter-spacing:0;}
  .brandbar p{margin:4px 0 0; font-size:12.5px; color:#FBE6C8; font-weight:500;}
  .logout-btn{
    background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.28);
    color:#FFF6E9; font-family:'Cairo',sans-serif; font-size:12px; font-weight:600;
    padding:7px 12px; border-radius:100px; cursor:pointer;
  }

  /* ---------- login ---------- */
  #screen-login{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .login-card{width:100%; max-width:380px;}
  .login-mark{
    width:56px;height:56px;border-radius:16px;
    background:linear-gradient(135deg,#A23B2E,#C6861F);
    display:flex;align-items:center;justify-content:center;
    font-size:26px; margin-bottom:18px;
    box-shadow: var(--shadow);
  }
  .login-title{font-size:23px; font-weight:800; margin:0 0 4px;}
  .login-sub{font-size:13.5px; color:var(--ink-soft); margin:0 0 26px; line-height:1.6;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; padding:12px 14px; border-radius:11px;
    border:1.5px solid var(--line); background:var(--card);
    font-family:'Cairo',sans-serif; font-size:14.5px; color:var(--ink);
    outline:none; transition:border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--saffron);}
  .btn{
    width:100%; padding:13px; border-radius:11px; border:none;
    font-family:'Cairo',sans-serif; font-weight:800; font-size:15px;
    cursor:pointer; transition:transform .08s, opacity .15s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--ink); color:#FFF6E9;}
  .btn-primary:disabled{opacity:.45; cursor:not-allowed;}
  .btn-accent{background:linear-gradient(135deg,#A23B2E,#C6861F); color:#FFF6E9;}
  .btn-ghost{background:var(--paper-2); color:var(--ink);}
  #login-error{color:var(--paprika); font-size:12.5px; margin-top:10px; min-height:16px; font-weight:600;}

  /* ---------- content ---------- */
  .content{padding:16px 16px 4px;}
  .section-title{font-size:13px; font-weight:800; color:var(--ink-soft); margin:18px 0 10px; display:flex; align-items:center; gap:6px;}

  /* stats strip */
  .stats-row{display:flex; gap:10px; margin-top:-16px; position:relative; z-index:2; padding:0 16px;}
  .stat-card{
    flex:1; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; box-shadow:var(--shadow);
  }
  .stat-num{font-size:20px; font-weight:800; color:var(--ink);}
  .stat-label{font-size:11px; color:var(--ink-soft); font-weight:600; margin-top:2px;}

  /* search */
  .search-box{position:relative;}
  .search-box input{
    width:100%; padding:13px 14px 13px 14px; border-radius:12px;
    border:1.5px solid var(--line); background:var(--card);
    font-family:'Cairo',sans-serif; font-size:14.5px; color:var(--ink); outline:none;
  }
  .search-box input:focus{border-color:var(--saffron);}
  .filter-row{display:flex; gap:8px; margin-top:10px;}
  .filter-row select{
    flex:1; padding:9px 10px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--card); font-family:'Cairo',sans-serif; font-size:12.5px; color:var(--ink-soft);
  }

  /* customer list */
  .cust-list{margin-top:12px; display:flex; flex-direction:column; gap:8px;}
  .cust-item{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; display:flex; justify-content:space-between; align-items:center;
    cursor:pointer; transition:border-color .12s;
  }
  .cust-item:active{border-color:var(--saffron);}
  .cust-name{font-size:14.5px; font-weight:700; color:var(--ink);}
  .cust-meta{font-size:11.5px; color:var(--ink-soft); margin-top:3px;}
  .badge{font-size:10.5px; font-weight:800; padding:4px 9px; border-radius:100px; white-space:nowrap;}
  .badge-done{background:#EAF1E3; color:var(--olive);}
  .badge-pending{background:var(--paper-2); color:var(--ink-soft);}
  .empty-note{text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 10px;}

  /* entry form */
  .cust-banner{
    background:linear-gradient(135deg, rgba(162,59,46,0.08), rgba(198,134,31,0.08));
    border:1px solid rgba(162,59,46,0.16); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:14px;
  }
  .cust-banner .top{display:flex; justify-content:space-between; align-items:flex-start;}
  .cust-banner .name{font-size:16px; font-weight:800;}
  .cust-banner .code{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .back-x{background:none; border:none; color:var(--ink-soft); font-size:13px; font-weight:700; cursor:pointer; font-family:'Cairo',sans-serif;}
  .progress-track{height:6px; background:var(--paper-2); border-radius:100px; margin-top:12px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg,#A23B2E,#C6861F); border-radius:100px; transition:width .25s;}
  .progress-label{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-soft); margin-top:6px; font-weight:600;}

  .q-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px 14px; margin-bottom:10px;}
  .q-label{font-size:13px; font-weight:700; color:var(--ink); margin-bottom:8px; display:flex; gap:6px; align-items:flex-start;}
  .q-label .req{color:var(--paprika); font-size:14px; line-height:1;}
  .seg{display:flex; gap:8px;}
  .seg button{
    flex:1; padding:10px 8px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--paper); font-family:'Cairo',sans-serif; font-weight:700; font-size:13.5px;
    color:var(--ink-soft); cursor:pointer; transition:all .12s;
  }
  .seg button.sel-yes.on{background:#EAF1E3; border-color:var(--olive); color:var(--olive);}
  .seg button.sel-no.on{background:#F6E7E4; border-color:var(--paprika); color:var(--paprika);}
  .seg button.sel-plain.on{background:var(--saffron); border-color:var(--saffron); color:#fff;}
  .q-card input[type=text], .q-card input[type=number], .q-card input[type=url], .q-card textarea, .q-card select{
    width:100%; padding:10px 12px; border-radius:9px; border:1.5px solid var(--line);
    background:var(--paper); font-family:'Cairo',sans-serif; font-size:13.5px; color:var(--ink); outline:none;
  }
  .q-card input:focus, .q-card select:focus, .q-card textarea:focus{border-color:var(--saffron); background:#fff;}
  .q-card textarea{min-height:70px; resize:vertical;}
  .opts-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .opts-grid button{
    padding:9px 14px; border-radius:100px; border:1.5px solid var(--line);
    background:var(--paper); font-family:'Cairo',sans-serif; font-weight:700; font-size:13px;
    color:var(--ink-soft); cursor:pointer;
  }
  .opts-grid button.on{background:var(--saffron); border-color:var(--saffron); color:#fff;}

  .save-bar{
    position:sticky; bottom:0; background:linear-gradient(0deg, var(--paper) 60%, rgba(250,245,234,0));
    padding:16px 0 8px; margin-top:6px;
  }

  /* bottom nav */
  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; max-width:560px; margin:0 auto;
    background:var(--card); border-top:1px solid var(--line);
    display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    box-shadow: 0 -2px 12px rgba(43,27,18,0.06);
  }
  .nav-btn{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 4px; cursor:pointer; color:var(--ink-soft); font-family:'Cairo',sans-serif;
  }
  .nav-btn .ic{font-size:19px;}
  .nav-btn .lb{font-size:10.5px; font-weight:700;}
  .nav-btn.active{color:var(--paprika);}

  /* records */
  .rec-item{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; cursor:pointer;}
  .rec-top{display:flex; justify-content:space-between; align-items:center;}
  .rec-name{font-size:14px; font-weight:700;}
  .rec-date{font-size:11px; color:var(--ink-soft); margin-top:3px;}

  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#FFF6E9; padding:11px 20px; border-radius:100px;
    font-size:13px; font-weight:700; z-index:999; box-shadow:var(--shadow);
    animation: toastIn .25s ease-out;
  }
  @keyframes toastIn{from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);}}

  .loader{
    position:fixed; inset:0; background:var(--paper); display:flex; align-items:center; justify-content:center; z-index:1000;
  }
  .loader .dot{width:9px;height:9px;border-radius:50%; background:var(--paprika); margin:0 3px; display:inline-block; animation:bounce 1.1s infinite ease-in-out;}
  .loader .dot:nth-child(2){animation-delay:.15s; background:var(--saffron);}
  .loader .dot:nth-child(3){animation-delay:.3s; background:var(--olive);}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.5;} 40%{transform:translateY(-8px);opacity:1;}}
</style>
</head>

  <div id="screen-login" class="hidden">

      <div class="field">
        <label>اسمك</label>
        <input type="text" id="repNameInput" placeholder="مثال: أحمد محمد" autocomplete="name">
      </div>
      <button class="btn btn-accent" id="loginBtn">ابدأ السيرفي</button>
      <div id="login-error"></div>
    </div>
  </div>

  <!-- ===== MAIN ===== -->
  <div id="screen-main" class="hidden">
    <div class="brandbar">
      <div class="row">
        <div>
          <h1>عطارة — سيرفي المحلات</h1>
          <p id="repLabel">—</p>
        </div>
        <button class="logout-btn" id="logoutBtn">تغيير الاسم</button>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="statDone">0</div>
        <div class="stat-label">تم السيرفي</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">إجمالي المحلات</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statPct">0%</div>
        <div class="stat-label">نسبة الإنجاز</div>
      </div>
    </div>

    <!-- ---- TAB: HOME/SEARCH ---- -->
    <div id="tab-home" class="content">
      <div class="section-title">🔍 اختر محل لبدء السيرفي</div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث بالاسم / الكود / العنوان">
      </div>
      <div class="filter-row">
        <select id="filterRegion"><option value="">كل المناطق</option></select>
        <select id="filterDistrict"><option value="">كل الأحياء</option></select>
      </div>
      <div class="cust-list" id="custList"></div>
    </div>

    <!-- ---- TAB: ENTRY ---- -->
    <div id="tab-entry" class="content hidden">
      <div class="cust-banner">
        <div class="top">
          <div>
            <div class="name" id="entCustName">—</div>
            <div class="code" id="entCustMeta">—</div>
          </div>
          <button class="back-x" id="cancelEntryBtn">✕ إلغاء</button>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        <div class="progress-label"><span id="progressText">0 / 0</span><span id="progressPct">0%</span></div>
      </div>

      <div id="formFields"></div>

      <div class="save-bar">
        <button class="btn btn-accent" id="saveBtn" disabled>💾 حفظ السيرفي</button>
      </div>
    </div>

    <!-- ---- TAB: RECORDS ---- -->
    <div id="tab-records" class="content hidden">
      <div class="section-title">📋 آخر السيرفيهات اللي عملتها</div>
      <div id="recList"></div>
    </div>
  </div>

  <div class="bottom-nav" id="bottomNav">
    <button class="nav-btn active" data-tab="home"><span class="ic">🏠</span><span class="lb">الرئيسية</span></button>
    <button class="nav-btn" data-tab="records"><span class="ic">📋</span><span class="lb">سجلاتي</span></button>
  </div>

</div>

  { id:"standExists", label:"هل يوجد إستاند؟", type:"yesno" },
  { id:"standCount", label:"عدد الإستاند", type:"number",
    showIf:a=>a.standExists==="نعم", requiredIf:a=>a.standExists==="نعم" },
  { id:"standCompany", label:"اسم الشركة اللى منزلة إستاند", type:"text",
    showIf:a=>a.standExists==="نعم", requiredIf:a=>a.standExists==="نعم" },
  { id:"signExists", label:"هل يوجد يافطة شركات؟", type:"yesno" },
  { id:"signCompany", label:"اسم الشركة المركبة ليافطة الدعايا", type:"text",
    showIf:a=>a.signExists==="نعم", requiredIf:a=>a.signExists==="نعم" },
  { id:"canopyExists", label:"هل يوجد تاندة شركات؟", type:"yesno" },
  { id:"canopyCompany", label:"اسم الشركة المركبة تاندة الدعايا", type:"text",
    showIf:a=>a.canopyExists==="نعم", requiredIf:a=>a.canopyExists==="نعم" },
  { id:"areaType", label:"نوع المنطقة", type:"select", options:["منطقة راقية","منطقة شعبية"] },
  { id:"locationType", label:"نوع لوكيشن المحل", type:"select", options:["شارع رئيسي","شارع جانبى","داخل سوق الخضروات","أخرى"] },
  { id:"sackExists", label:"شوال أو حافظة لبيع منتجات التوابل السائلة", type:"yesno" },
  { id:"sackCompany", label:"اسم الشركة اللى عاملة الشوال أو الحافظة", type:"text",
    showIf:a=>a.sackExists==="نعم", requiredIf:a=>a.sackExists==="نعم" },
  { id:"acceptsCoordination", label:"هل يقبل التنسيق؟", type:"yesno" },
  { id:"hasSocial", label:"هل عنده صفحة على السوشيال ميديا؟", type:"yesno" },
  { id:"socialLink", label:"لينك الصفحة", type:"url",
    showIf:a=>a.hasSocial==="نعم", requiredIf:a=>a.hasSocial==="نعم" },
  { id:"hasDelivery", label:"هل يوجد دليفرى؟", type:"yesno" },
  { id:"notes", label:"ملاحظات أخرى", type:"textarea", requiredIf:()=>false },
];

const SURVEY_COLLECTION = "ettara_surveys";

/* ---------------- state ---------------- */
let state = {
  user:null,
  repName:null,
  page:"home",
  selected:null,       // selected customer object
  answers:{},
  editingExisting:false,
  doneCodes:new Set(), // codes surveyed (globally, from Firestore)
};

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function toast(msg){
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

function fieldVisible(f){ return f.showIf ? f.showIf(state.answers) : true; }
function fieldRequired(f){
  if(!fieldVisible(f)) return false;
  return f.requiredIf ? f.requiredIf(state.answers) : true;
}
function fieldFilled(f){
  const v = state.answers[f.id];
  return v !== undefined && v !== null && String(v).trim() !== "";
}

/* ---------------- populate region/district filters ---------------- */
function initFilters(){
  const regions = [...new Set(CUSTOMERS.map(c=>c.reg).filter(Boolean))].sort();
  const districts = [...new Set(CUSTOMERS.map(c=>c.dist).filter(Boolean))].sort();
  const rSel = $("#filterRegion"), dSel = $("#filterDistrict");
  regions.forEach(r=>{ const o=document.createElement("option"); o.value=r; o.textContent=r; rSel.appendChild(o); });
  districts.forEach(d=>{ const o=document.createElement("option"); o.value=d; o.textContent=d; dSel.appendChild(o); });
}

/* ---------------- render customer list ---------------- */
function renderCustList(){
  const q = $("#searchInput").value.trim().toLowerCase();
  const rf = $("#filterRegion").value;
  const df = $("#filterDistrict").value;
  let list = CUSTOMERS;
  if(rf) list = list.filter(c=>c.reg===rf);
  if(df) list = list.filter(c=>c.dist===df);
  if(q){
    list = list.filter(c =>
      (c.n||"").toLowerCase().includes(q) ||
      (c.c||"").toLowerCase().includes(q) ||
      (c.addr||"").toLowerCase().includes(q)
    );
  }
  list = list.slice(0, 80);
  const wrap = $("#custList");
  wrap.innerHTML = "";
  if(list.length===0){
    wrap.innerHTML = '<div class="empty-note">مفيش محلات مطابقة للبحث</div>';
    return;
  }
  list.forEach(c=>{
    const done = state.doneCodes.has(c.c);
    const div = document.createElement("div");
    div.className = "cust-item";
    div.innerHTML = `
      <div>
        <div class="cust-name">${c.n||"—"}</div>
        <div class="cust-meta">#${c.c} • ${c.dist||""}</div>
      </div>
      <span class="badge ${done?"badge-done":"badge-pending"}">${done?"✓ تم":"لم يُسجل"}</span>
    `;
    div.addEventListener("click", ()=>openEntry(c));
    wrap.appendChild(div);
  });
}

/* ---------------- entry form ---------------- */
async function openEntry(cust){
  state.selected = cust;
  state.answers = {};
  state.editingExisting = false;

  // try to preload existing survey for this customer to allow edit
  try{
    const snap = await getDoc(doc(db, SURVEY_COLLECTION, cust.c));
    if(snap.exists()){
      const data = snap.data();
      state.answers = { ...(data.answers||{}) };
      state.editingExisting = true;
    }
  }catch(e){ /* offline or no perms — just start fresh */ }

  $("#entCustName").textContent = cust.n || "—";
  $("#entCustMeta").textContent = `#${cust.c} • ${cust.reg||""} ${cust.dist? "• "+cust.dist:""}`;
  renderForm();
  goTab("entry");
}

function setAnswer(id, val){
  state.answers[id] = val;
  renderForm();
}

function renderForm(){
  const wrap = $("#formFields");
  wrap.innerHTML = "";
  FIELDS.forEach(f=>{
    if(!fieldVisible(f)) return;
    const card = document.createElement("div");
    card.className = "q-card";
    const req = fieldRequired(f);
    const label = document.createElement("div");
    label.className = "q-label";
    label.innerHTML = `<span>${f.label}</span>${req?'<span class="req">*</span>':''}`;
    card.appendChild(label);

    if(f.type === "yesno"){
      const seg = document.createElement("div"); seg.className="seg";
      ["نعم","لا"].forEach(opt=>{
        const b = document.createElement("button");
        b.type="button";
        b.textContent = opt;
        b.className = (opt==="نعم"?"sel-yes":"sel-no") + (state.answers[f.id]===opt?" on":"");
        b.addEventListener("click", ()=>setAnswer(f.id, opt));
        seg.appendChild(b);
      });
      card.appendChild(seg);
    } else if(f.type === "select"){
      const grid = document.createElement("div"); grid.className="opts-grid";
      f.options.forEach(opt=>{
        const b = document.createElement("button");
        b.type="button"; b.textContent = opt;
        b.className = "sel-plain" + (state.answers[f.id]===opt?" on":"");
        b.addEventListener("click", ()=>setAnswer(f.id, opt));
        grid.appendChild(b);
      });
      card.appendChild(grid);
    } else if(f.type === "textarea"){
      const ta = document.createElement("textarea");
      ta.placeholder = "اكتب ملاحظاتك هنا (اختياري)";
      ta.value = state.answers[f.id] || "";
      ta.addEventListener("input", e=>{ state.answers[f.id]=e.target.value; updateProgressOnly(); });
      card.appendChild(ta);
    } else {
      const input = document.createElement("input");
      input.type = f.type === "number" ? "number" : (f.type === "url" ? "url" : "text");
      if(f.type==="number") input.min = "0";
      if(f.type==="url") input.placeholder = "https://...";
      input.value = state.answers[f.id] || "";
      input.addEventListener("input", e=>{ state.answers[f.id]=e.target.value; updateProgressOnly(); });
      card.appendChild(input);
    }
    wrap.appendChild(card);
  });
  updateProgress();
}

function updateProgressOnly(){ updateProgress(); }

function updateProgress(){
  const visibleFields = FIELDS.filter(fieldVisible);
  const requiredFields = visibleFields.filter(fieldRequired);
  const filledRequired = requiredFields.filter(fieldFilled);
  const total = requiredFields.length;
  const done = filledRequired.length;
  const pct = total===0 ? 100 : Math.round((done/total)*100);
  $("#progressFill").style.width = pct+"%";
  $("#progressText").textContent = `${done} / ${total}`;
  $("#progressPct").textContent = pct+"%";
  $("#saveBtn").disabled = done < total;
}

async function saveSurvey(){
  const requiredFields = FIELDS.filter(f=>fieldVisible(f) && fieldRequired(f));
  const missing = requiredFields.filter(f=>!fieldFilled(f));
  if(missing.length>0){ toast("فيه حقول لسه ناقصة"); return; }

  const btn = $("#saveBtn");
  btn.disabled = true; btn.textContent = "⏳ جاري الحفظ...";

  const cust = state.selected;
  const payload = {
    customerCode: cust.c,
    customerName: cust.n,
    region: cust.reg,
    district: cust.dist,
    address: cust.addr,
    lat: cust.lat ?? null,
    lng: cust.lng ?? null,
    answers: { ...state.answers },
    repName: state.repName,
    repUid: state.user.uid,
    updatedAt: serverTimestamp(),
    ...(state.editingExisting ? {} : { createdAt: serverTimestamp() }),
  };

  try{
    await setDoc(doc(db, SURVEY_COLLECTION, cust.c), payload, { merge:true });
    state.doneCodes.add(cust.c);
    toast(state.editingExisting ? "✅ تم تحديث السيرفي" : "✅ تم حفظ السيرفي");
    renderCustList();
    updateStats();
    loadRecords();
    goTab("home");
  }catch(e){
    console.error(e);
    toast("❌ حصل خطأ فى الحفظ، حاول تانى");
  }finally{
    btn.textContent = "💾 حفظ السيرفي";
    updateProgress();
  }
}

/* ---------------- records tab ---------------- */
async function loadRecords(){
  const wrap = $("#recList");
  wrap.innerHTML = '<div class="empty-note">جارِ التحميل...</div>';
  try{
    const q1 = query(
      collection(db, SURVEY_COLLECTION),
      where("repUid","==", state.user.uid),
      orderBy("updatedAt","desc"),
      limit(50)
    );
    const snap = await getDocs(q1);
    if(snap.empty){
      wrap.innerHTML = '<div class="empty-note">لسه ما عملتش أى سيرفي</div>';
      return;
    }
    wrap.innerHTML = "";
    snap.forEach(d=>{
      const data = d.data();
      const cust = CUSTOMERS.find(c=>c.c===data.customerCode);
      const div = document.createElement("div");
      div.className = "rec-item";
      const dt = data.updatedAt && data.updatedAt.toDate ? data.updatedAt.toDate() : null;
      div.innerHTML = `
        <div class="rec-top">
          <div class="rec-name">${data.customerName||"—"}</div>
          <span class="badge badge-done">✓ محفوظ</span>
        </div>
        <div class="rec-date">#${data.customerCode} ${dt? "• "+dt.toLocaleString("ar-EG",{dateStyle:"medium",timeStyle:"short"}) : ""}</div>
      `;
      div.addEventListener("click", ()=> openEntry(cust || {c:data.customerCode, n:data.customerName, reg:data.region, dist:data.district, addr:data.address, lat:data.lat, lng:data.lng}));
      wrap.appendChild(div);
    });
  }catch(e){
    console.error(e);
    // fallback without orderBy if composite index missing
    try{
      const q2 = query(collection(db, SURVEY_COLLECTION), where("repUid","==", state.user.uid), limit(50));
      const snap2 = await getDocs(q2);
      wrap.innerHTML = "";
      if(snap2.empty){ wrap.innerHTML = '<div class="empty-note">لسه ما عملتش أى سيرفي</div>'; return; }
      snap2.forEach(d=>{
        const data = d.data();
        const cust = CUSTOMERS.find(c=>c.c===data.customerCode);
        const div = document.createElement("div");
        div.className = "rec-item";
        div.innerHTML = `<div class="rec-top"><div class="rec-name">${data.customerName||"—"}</div><span class="badge badge-done">✓ محفوظ</span></div><div class="rec-date">#${data.customerCode}</div>`;
        div.addEventListener("click", ()=> openEntry(cust || {c:data.customerCode, n:data.customerName}));
        wrap.appendChild(div);
      });
    }catch(e2){
      wrap.innerHTML = '<div class="empty-note">تعذر تحميل السجلات الآن</div>';
    }
  }
}

/* ---------------- global stats (all reps) ---------------- */
async function updateStats(){
  $("#statTotal").textContent = CUSTOMERS.length;
  try{
    const snap = await getDocs(collection(db, SURVEY_COLLECTION));
    state.doneCodes = new Set();
    snap.forEach(d=> state.doneCodes.add(d.id));
    const done = state.doneCodes.size;
    $("#statDone").textContent = done;
    $("#statPct").textContent = Math.round((done/CUSTOMERS.length)*100)+"%";
    renderCustList();
  }catch(e){
    console.error(e);
  }
}

/* ---------------- tabs / nav ---------------- */
function goTab(tab){
  state.page = tab;
  ["home","entry","records"].forEach(t=>{
    $("#tab-"+t).classList.toggle("hidden", t!==tab);
  });
  $("#bottomNav").classList.toggle("hidden", tab==="entry");
  $$(".nav-btn").forEach(b=> b.classList.toggle("active", b.dataset.tab===tab));
  if(tab==="records") loadRecords();
}

/* ---------------- identity (no username/password — just a name + silent anonymous auth) ---------------- */
const REP_NAME_KEY = "ettara_rep_name";

function showNameScreen(){
  $("#screen-main").classList.add("hidden");
  $("#screen-login").classList.remove("hidden");
  $("#repNameInput").value = localStorage.getItem(REP_NAME_KEY) || "";
}

function enterApp(){
  $("#screen-login").classList.add("hidden");
  $("#screen-main").classList.remove("hidden");
  $("#repLabel").textContent = state.repName;
  goTab("home");
  updateStats();
}

$("#loginBtn").addEventListener("click", ()=>{
  const name = $("#repNameInput").value.trim();
  $("#login-error").textContent = "";
  if(!name){ $("#login-error").textContent = "من فضلك اكتب اسمك"; return; }
  if(!state.user){ $("#login-error").textContent = "لسه بيتم الاتصال، حاول تاني بعد لحظة"; return; }
  localStorage.setItem(REP_NAME_KEY, name);
  state.repName = name;
  enterApp();
});

$("#logoutBtn").addEventListener("click", ()=>{
  localStorage.removeItem(REP_NAME_KEY);
  state.repName = null;
  showNameScreen();
});

onAuthStateChanged(auth, (user)=>{
  $("#boot-loader").classList.add("hidden");
  $("#app").classList.remove("hidden");
  if(user){
    state.user = user;
    const savedName = localStorage.getItem(REP_NAME_KEY);
    if(savedName){
      state.repName = savedName;
      enterApp();
    }else{
      showNameScreen();
    }
  }else{
    state.user = null;
    showNameScreen();
  }
});

// sign in silently — no login form, just an anonymous Firebase session
signInAnonymously(auth).catch((e)=>{
  console.error("Anonymous sign-in failed:", e);
  $("#boot-loader").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#login-error").textContent = "تعذر الاتصال بالسيرفر. تأكد إن Anonymous Auth مفعّل فى Firebase.";
  showNameScreen();
});

/* fallback: hide loader even if firebase config is wrong / offline */
setTimeout(()=>{
  $("#boot-loader").classList.add("hidden");
  $("#app").classList.remove("hidden");
  if($("#screen-login").classList.contains("hidden") && $("#screen-main").classList.contains("hidden")){
    showNameScreen();
  }
}, 4000);

/* ---------------- wiring ---------------- */
initFilters();
renderCustList();
$("#searchInput").addEventListener("input", renderCustList);
$("#filterRegion").addEventListener("change", renderCustList);
$("#filterDistrict").addEventListener("change", renderCustList);
$("#cancelEntryBtn").addEventListener("click", ()=> goTab("home"));
$("#saveBtn").addEventListener("click", saveSurvey);
$$(".nav-btn").forEach(b=> b.addEventListener("click", ()=> goTab(b.dataset.tab)));

</script>
</body>
</html>
