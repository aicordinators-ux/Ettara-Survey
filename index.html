<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#B4503C">
<title>Ettara Survey 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{
    --bg:#FDFBF5;
    --bg-2:#F7F1E4;
    --card:#FFFFFF;
    --card-2:#FAF6EC;
    --line:#EBE0CC;
    --text:#3E2C20;
    --muted:#7E6B58;
    --dim:#AD9C86;
    --blue:#B4503C;    --blue-2:#9A4232;
    --green:#6E8F4A;
    --green-dim:#5E7C3D;
    --red:#B4503C;
    --amber:#D19A33;
    --cyan:#A97C24;
    --radius:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Cairo',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }
  #app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:70px;}
  .hidden{display:none !important;}

  /* ---------- header ---------- */
  .topbar{
    background:linear-gradient(120deg, #B4503C 0%, #C9704A 52%, #DCA94F 115%);
    padding:14px 16px 0;
    position:relative;
  }
  .topbar .head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .brand{text-align:left;}
  .brand h1{margin:0; font-size:17px; font-weight:800; display:flex; align-items:center; gap:7px;}
  .brand .sub{font-size:10.5px; color:#FDEFD9; margin-top:3px; font-weight:600;}
  .who{
    background:rgba(255,255,255,0.13); border:1px solid rgba(255,255,255,0.2);
    color:#FFF6E9; font-family:'Cairo',sans-serif; font-size:11px; font-weight:700;
    padding:6px 11px; border-radius:100px; cursor:pointer; white-space:nowrap;
  }
  .stats{display:flex; gap:8px; margin-top:13px;}
  .stat{
    flex:1; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.11);
    border-radius:10px; padding:8px 6px; text-align:center;
  }
  .stat .v{font-size:17px; font-weight:800; line-height:1.2;}
  .stat .k{font-size:9.5px; color:#FDEFD9; font-weight:600; margin-top:1px;}
  .stat.done .v{color:#B9E39A;}
  .stat.left .v{color:#FDEFD9;}
  .stat.defer .v{color:#FFD9A0;}
  .topbar .bar{height:4px; background:rgba(255,255,255,0.14); margin-top:12px;}
  .topbar .bar > div{height:100%; background:linear-gradient(90deg,#8FBF5F,#B9E39A); transition:width .3s;}

  /* region summary strip (top filter) */
  .regstrip{
    display:flex; gap:8px; overflow-x:auto; padding:12px 0 13px;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .regstrip::-webkit-scrollbar{display:none;}
  .regcard{
    flex:0 0 auto; min-width:132px; background:rgba(255,255,255,0.09);
    border:1px solid rgba(255,255,255,0.16); border-radius:10px;
    padding:9px 11px; cursor:pointer; transition:background .15s, border-color .15s;
  }
  .regcard.on{background:rgba(255,255,255,0.22); border-color:#FFF6E9;}
  .regcard .rn{font-size:11.5px; font-weight:800; color:#FFF6E9; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; max-width:150px;}
  .regcard .rp{font-size:16px; font-weight:800; color:#FFF6E9; margin-top:3px;}
  .regcard .rbar{height:4px; background:rgba(255,255,255,0.2); border-radius:100px; margin-top:6px; overflow:hidden;}
  .regcard .rbar > div{height:100%; background:#B9E39A; border-radius:100px;}
  .regcard .rk{font-size:9.5px; color:#FDEFD9; font-weight:700; margin-top:6px; display:flex; gap:7px; white-space:nowrap;}
  .regcard .rk i{font-style:normal;}
  .regcard .rk .d{color:#B9E39A;}
  .regcard .rk .f{color:#FFD9A0;}

  /* ---------- filters ---------- */
  .filters{padding:12px 16px 0; display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .filters select{
    width:100%; padding:9px 10px; border-radius:9px; border:1px solid var(--line);
    background:var(--card); color:var(--text);
    font-family:'Cairo',sans-serif; font-size:12px; font-weight:600; outline:none;
    appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(10px) calc(50% - 2px), calc(15px) calc(50% - 2px);
    background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
  }
  .searchwrap{padding:8px 16px 0;}
  .searchwrap input{
    width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:var(--text);
    font-family:'Cairo',sans-serif; font-size:13.5px; outline:none;
  }
  .searchwrap input::placeholder{color:var(--dim);}
  .searchwrap input:focus{border-color:var(--blue);}

  /* ---------- store cards ---------- */
  .list{padding:12px 16px 8px; display:flex; flex-direction:column; gap:10px;}
  .store{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 13px; cursor:pointer; transition:border-color .12s;
    box-shadow:0 1px 2px rgba(62,44,32,0.04), 0 3px 10px rgba(62,44,32,0.035);
  }
  .store:active{border-color:var(--blue);}
  .store .row1{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .store .name{font-size:14.5px; font-weight:800; line-height:1.35;}
  .tag-dist{
    background:var(--blue); color:#fff; font-size:9.5px; font-weight:700;
    padding:3px 9px; border-radius:5px; white-space:nowrap;
  }
  .addr{
    background:var(--card-2); border-radius:8px; padding:7px 10px; margin-top:8px;
    font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:6px;
    justify-content:space-between;
  }
  .addr .txt{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .addr a.gp{
    color:#B4503C; text-decoration:none; font-size:14px; flex-shrink:0;
    padding:0 2px;
  }
  .addr .nogp{color:var(--dim); font-size:13px; flex-shrink:0; opacity:.5;}
  .meta{font-size:11px; color:var(--dim); margin-top:7px; line-height:1.7;}
  .meta b{color:var(--muted); font-weight:700;}
  .chips{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; justify-content:flex-end;}
  .chip{font-size:9.5px; font-weight:700; padding:4px 8px; border-radius:5px; white-space:nowrap;}
  .chip.ok{background:#F0F6E8; color:#5E7C3D; border:1px solid #DDE9CC;}
  .chip.no{background:var(--bg-2); color:var(--dim); border:1px solid var(--line);}
  .chip.warn{background:#FBEFEC; color:#B4503C; border:1px solid #F2D8D1;}
  .chip.info{background:#FDF6E8; color:#A97C24; border:1px solid #F0E3C5;}
  .chip.amber{background:#FDF6E8; color:#A0741F; border:1px solid #F0E3C5;}
  .stamp{font-size:10px; color:var(--dim); margin-top:7px; text-align:left;}
  .empty{text-align:center; color:var(--dim); font-size:13px; padding:40px 16px;}
  .more-note{text-align:center; color:var(--dim); font-size:11.5px; padding:4px 0 10px;}

  /* ---------- entry ---------- */
  .ent-head{
    background:linear-gradient(120deg,#B4503C,#DCA94F); padding:14px 16px 16px;
  }
  .ent-head .row{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .ent-head .nm{font-size:16px; font-weight:800;}
  .ent-head .cd{font-size:11px; color:#FDEFD9; margin-top:3px;}
  .xbtn{background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.2); color:#FFF6E9;
    font-family:'Cairo',sans-serif; font-size:11.5px; font-weight:700; padding:6px 11px; border-radius:100px; cursor:pointer;}
  .ent-prog{height:5px; background:rgba(255,255,255,0.15); border-radius:100px; margin-top:12px; overflow:hidden;}
  .ent-prog > div{height:100%; background:linear-gradient(90deg,var(--green-dim),var(--green)); transition:width .25s;}
  .ent-plabel{display:flex; justify-content:space-between; font-size:10.5px; color:#FDEFD9; margin-top:6px; font-weight:700;}
  .locrow{display:flex; gap:8px; margin-top:12px;}
  .locbtn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:5px;
    padding:9px 8px; border-radius:9px; border:1px solid rgba(255,255,255,0.22);
    background:rgba(255,255,255,0.1); color:#FFF6E9;
    font-family:'Cairo',sans-serif; font-weight:700; font-size:11.5px;
    cursor:pointer; text-decoration:none;
  }
  .locbtn.go{background:var(--green-dim); border-color:var(--green-dim); color:#fff;}
  .locbtn.cap{background:rgba(255,255,255,0.2); border-color:rgba(255,246,233,0.5); color:#FFF6E9;}
  .locbtn:disabled{opacity:.55;}
  .locnote{font-size:10px; color:#FDEFD9; margin-top:7px; text-align:center; font-weight:600;}

  .qwrap{padding:14px 16px 8px;}
  .q{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:12px 13px; margin-bottom:9px;}
  .q .lab{font-size:12.5px; font-weight:700; margin-bottom:9px; display:flex; gap:5px;}
  .q .lab .star{color:var(--red);}
  .seg{display:flex; gap:7px;}
  .seg button{
    flex:1; padding:9px 6px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg-2); color:var(--muted);
    font-family:'Cairo',sans-serif; font-weight:700; font-size:12.5px; cursor:pointer;
  }
  .seg button.yes.on{background:#F0F6E8; border-color:var(--green); color:var(--green);}
  .seg button.no.on{background:#FBEFEC; border-color:var(--red); color:#B4503C;}
  .pills{display:flex; flex-wrap:wrap; gap:7px;}
  .pills button{
    padding:8px 14px; border-radius:100px; border:1px solid var(--line);
    background:var(--bg-2); color:var(--muted);
    font-family:'Cairo',sans-serif; font-weight:700; font-size:12px; cursor:pointer;
  }
  .pills button.on{background:var(--blue); border-color:var(--blue); color:#fff;}
  .q input, .q textarea{
    width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg-2); color:var(--text);
    font-family:'Cairo',sans-serif; font-size:13px; outline:none;
  }
  .q input:focus, .q textarea:focus{border-color:var(--blue);}
  .q textarea{min-height:65px; resize:vertical;}
  .savewrap{padding:6px 16px 16px; position:sticky; bottom:0;
    background:linear-gradient(0deg,var(--bg) 65%, rgba(11,18,32,0));}
  .savebtn{
    width:100%; padding:13px; border-radius:11px; border:none;
    background:var(--green-dim); color:#fff;
    font-family:'Cairo',sans-serif; font-weight:800; font-size:14.5px; cursor:pointer;
  }
  .savebtn:disabled{background:var(--card-2); color:var(--dim); cursor:not-allowed;}
  .deferbtn{
    width:100%; padding:11px; border-radius:11px; margin-top:8px;
    border:1.5px solid var(--amber); background:#FDF6E8; color:#A0741F;
    font-family:'Cairo',sans-serif; font-weight:800; font-size:13.5px; cursor:pointer;
  }

  /* defer sheet */
  .sheet{position:fixed; inset:0; background:rgba(62,44,32,0.38); z-index:900;
    display:flex; align-items:flex-end; justify-content:center;}
  .sheet-card{
    width:100%; max-width:760px; background:var(--card);
    border-radius:18px 18px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 26px rgba(62,44,32,.18);
  }
  .sheet-t{font-size:16px; font-weight:800;}
  .sheet-s{font-size:12.5px; color:var(--muted); margin:4px 0 14px;}
  .sheet-row{display:flex; gap:9px; margin-top:16px;}
  .sh-cancel, .sh-ok{
    flex:1; padding:12px; border-radius:10px; border:none;
    font-family:'Cairo',sans-serif; font-weight:800; font-size:13.5px; cursor:pointer;
  }
  .sh-cancel{background:var(--bg-2); color:var(--text);}
  .sh-ok{background:var(--amber); color:#fff;}
  .sh-ok:disabled{background:var(--card-2); color:var(--dim); cursor:not-allowed;}

  /* ---------- map ---------- */
  #mapEl{height:calc(100vh - 210px); min-height:340px; border-radius:0; background:var(--bg-2);}
  .map-legend{padding:9px 16px; display:flex; gap:14px; font-size:11px; color:var(--muted); font-weight:600;}
  .map-legend span{display:flex; align-items:center; gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .leaflet-popup-content-wrapper{background:var(--card); color:var(--text); border-radius:10px;}
  .leaflet-popup-tip{background:var(--card);}
  .leaflet-popup-content{margin:11px 13px; font-family:'Cairo',sans-serif; font-size:12.5px;}
  .pop-nm{font-weight:800; font-size:13px; margin-bottom:3px;}
  .pop-md{color:var(--muted); font-size:11px; margin-bottom:7px;}
  .pop-btn{display:inline-block; background:var(--blue); color:#fff; padding:6px 12px;
    border-radius:7px; text-decoration:none; font-weight:700; font-size:11.5px; margin-left:5px;}
  .pop-btn.g{background:var(--green-dim);}

  /* ---------- progress tab ---------- */
  .prog{padding:14px 16px;}
  .sec-t{font-size:13px; font-weight:800; color:var(--muted); margin:16px 0 9px;}
  .sec-t:first-child{margin-top:0;}
  .pcard{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:12px 13px; margin-bottom:9px; box-shadow:0 1px 2px rgba(62,44,32,0.04), 0 3px 10px rgba(62,44,32,0.035);}
  .pcard .r{display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:700;}
  .pcard .n{font-size:11.5px; color:var(--dim); font-weight:600;}
  .pbar{height:6px; background:var(--bg-2); border-radius:100px; margin-top:9px; overflow:hidden;}
  .pbar > div{height:100%; background:linear-gradient(90deg,var(--green-dim),var(--green)); border-radius:100px;}
  .big-ring{display:flex; align-items:center; justify-content:center; gap:20px; padding:6px 0 14px;}
  .ring{position:relative; width:112px; height:112px;}
  .ring svg{transform:rotate(-90deg);}
  .ring .ctr{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ring .pct{font-size:23px; font-weight:800;}
  .ring .cap{font-size:10px; color:var(--dim); font-weight:700;}
  .kv{display:flex; flex-direction:column; gap:9px;}
  .kv .i{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700;}
  .kv .i .n{font-size:16px; font-weight:800;}

  /* export */
  .exp-row{display:flex; gap:9px; margin-bottom:4px;}
  .exp-btn{
    flex:1; padding:12px 10px; border-radius:11px; border:1.5px solid var(--line);
    background:var(--card); color:var(--text);
    font-family:'Cairo',sans-serif; font-weight:800; font-size:13px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .exp-btn.main{background:var(--green-dim); border-color:var(--green-dim); color:#fff;}
  .exp-btn:disabled{opacity:.55; cursor:not-allowed;}
  .exp-note{font-size:11px; color:var(--dim); text-align:center; margin-top:8px; font-weight:600;}

  /* admin mode */
  .admin-flag{
    background:#FBEFEC; border:1px solid #F2D8D1; color:#B4503C;
    border-radius:10px; padding:9px 12px; font-size:11.5px; font-weight:700;
    display:flex; justify-content:space-between; align-items:center; margin-bottom:11px;
  }
  .admin-flag button{
    background:none; border:none; color:#B4503C; font-family:'Cairo',sans-serif;
    font-weight:800; font-size:11.5px; cursor:pointer; text-decoration:underline;
  }
  .delbtn{
    width:100%; padding:11px; border-radius:11px; margin-top:8px;
    border:1.5px solid #B4503C; background:#FBEFEC; color:#B4503C;
    font-family:'Cairo',sans-serif; font-weight:800; font-size:13.5px; cursor:pointer;
  }
  .sh-ok.danger{background:#B4503C;}

  /* ---------- bottom nav ---------- */
  .nav{
    position:fixed; bottom:0; left:0; right:0; max-width:760px; margin:0 auto;
    background:var(--card); border-top:1px solid var(--line);
    box-shadow:0 -2px 12px rgba(62,44,32,0.05);
    display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:800;
  }
  .nav button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:6px 2px; cursor:pointer; color:var(--dim); font-family:'Cairo',sans-serif;
    border-radius:9px;
  }
  .nav button .ic{font-size:17px;}
  .nav button .lb{font-size:10px; font-weight:700;}
  .nav button.on{color:var(--blue); background:#FDF3E9;}

  /* ---------- name gate ---------- */
  #gate{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .gate-card{width:100%; max-width:370px;}
  .gate-mark{width:54px;height:54px;border-radius:15px;
    background:linear-gradient(135deg,#C05B45,#DCA94F);
    display:flex;align-items:center;justify-content:center;font-size:25px;margin-bottom:17px;}
  .gate-card h1{font-size:21px; font-weight:800; margin:0 0 5px;}
  .gate-card p{font-size:13px; color:var(--muted); margin:0 0 22px; line-height:1.65;}
  .gate-card label{display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:6px;}
  .gate-card input{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:var(--text);
    font-family:'Cairo',sans-serif; font-size:14px; outline:none; margin-bottom:14px;
  }
  .gate-card input:focus{border-color:var(--blue);}
  .gate-card button{
    width:100%; padding:13px; border-radius:10px; border:none;
    background:linear-gradient(135deg,#C05B45,#DCA94F); color:#fff;
    font-family:'Cairo',sans-serif; font-weight:800; font-size:14.5px; cursor:pointer;
  }
  #gate-err{color:#B4503C; font-size:12px; margin-top:9px; min-height:15px; font-weight:600;}

  .toast{
    position:fixed; bottom:82px; left:50%; transform:translateX(-50%);
    background:#5A4132; border:1px solid #5A4132; color:#FFF8EC;
    padding:10px 19px; border-radius:100px; font-size:12.5px; font-weight:700;
    z-index:999; box-shadow:0 6px 22px rgba(62,44,32,.2);
  }
  .loader{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:1000;}
  .loader i{width:8px;height:8px;border-radius:50%;background:var(--blue);margin:0 3px;display:inline-block;animation:bnc 1.1s infinite;}
  .loader i:nth-child(2){animation-delay:.15s;background:var(--green);}
  .loader i:nth-child(3){animation-delay:.3s;background:var(--amber);}
  @keyframes bnc{0%,80%,100%{transform:translateY(0);opacity:.45;}40%{transform:translateY(-7px);opacity:1;}}
</style>
</head>
<body>

<div id="boot" class="loader"><i></i><i></i><i></i></div>

<div id="app" class="hidden">

  <!-- ========== NAME GATE ========== -->
  <div id="gate" class="hidden">
    <div class="gate-card">
      <div class="gate-mark">🧂</div>
      <h1>Ettara Survey 2026</h1>
      <p>اكتب اسمك عشان نعرف مين اللي بيسجل السيرفي — من غير يوزر نيم أو باسورد.</p>
      <label>اسمك</label>
      <input type="text" id="nameInput" placeholder="مثال: أحمد محمد" autocomplete="name">
      <button id="gateBtn">ابدأ السيرفي</button>
      <div id="gate-err"></div>
    </div>
  </div>

  <!-- ========== MAIN ========== -->
  <div id="main" class="hidden">

    <div class="topbar" id="topbar">
      <div class="head">
        <button class="who" id="whoBtn">تغيير الاسم</button>
        <div class="brand">
          <h1>Ettara Survey 2026 🧂</h1>
          <div class="sub" id="brandSub">—</div>
        </div>
      </div>
      <div class="stats">
        <div class="stat left"><div class="v" id="sLeft">0</div><div class="k">متبقي</div></div>
        <div class="stat defer"><div class="v" id="sDefer">0</div><div class="k">زيارات مؤجلة</div></div>
        <div class="stat done"><div class="v" id="sDone">0</div><div class="k">تم السيرفي</div></div>
        <div class="stat"><div class="v" id="sTotal">0</div><div class="k">إجمالي</div></div>
      </div>
      <div class="bar"><div id="topBar" style="width:0%"></div></div>
      <div class="regstrip" id="regStrip"></div>
    </div>

    <!-- ---- LIST TAB ---- -->
    <div id="t-list">
      <div class="filters">
        <select id="fRegion"><option value="">كل المناطق</option></select>
        <select id="fDistrict"><option value="">كل الديستريكت</option></select>
        <select id="fStatus">

const $ = s=>document.querySelector(s);
const $$ = s=>Array.from(document.querySelectorAll(s));

function toast(m){
  const e=document.createElement("div"); e.className="toast"; e.textContent=m;
  document.body.appendChild(e); setTimeout(()=>e.remove(),2200);
}
function hasCoords(c){
  return c && typeof c.lat==="number" && typeof c.lng==="number" && c.lat!==0 && c.lng!==0;
}
function coordsOf(c){
  const s = state.surveys.get(c.c);
  if(s && s.capturedLat && s.capturedLng) return {lat:s.capturedLat, lng:s.capturedLng, source:"captured"};
  if(hasCoords(c)) return {lat:c.lat, lng:c.lng, source:"master"};
  return null;
}
function statusOf(c){
  const s = state.surveys.get(c.c);
  if(!s) return "pending";
  // docs saved before the defer feature existed have no status = completed
  return s.status === "deferred" ? "deferred" : "done";
}
function isDone(c){ return statusOf(c)==="done"; }
function isDeferred(c){ return statusOf(c)==="deferred"; }
function fmtDate(ts){
  if(!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString("ar-EG",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}

/* ===== region tallies + top summary strip ===== */
function tally(list){
  const t={total:list.length, done:0, deferred:0, pending:0};
  list.forEach(c=>{
    const s=statusOf(c);
    if(s==="done") t.done++; else if(s==="deferred") t.deferred++; else t.pending++;
  });
  t.pct = t.total ? Math.round(t.done/t.total*100) : 0;
  return t;
}
function byRegion(){
  const m=new Map();
  CUSTOMERS.forEach(c=>{
    const k=c.reg||"—";
    if(!m.has(k)) m.set(k,[]);
    m.get(k).push(c);
  });
  return [...m.entries()]
    .map(([reg,list])=>({reg, ...tally(list)}))
    .sort((a,b)=>b.total-a.total);
}

function renderRegionStrip(){
  const strip=$("#regStrip");
  const cur=$("#fRegion").value;
  const all=tally(CUSTOMERS);
  const cards=[{reg:"", label:"كل المناطق", ...all}, ...byRegion().map(r=>({...r,label:r.reg}))];
  strip.innerHTML=cards.map(r=>`
    <div class="regcard ${r.reg===cur?"on":""}" data-reg="${r.reg}">
      <div class="rn">${r.label}</div>
      <div class="rp">${r.pct}%</div>
      <div class="rbar"><div style="width:${r.pct}%"></div></div>
      <div class="rk">
        <i class="d">✔ ${r.done}</i>
        <i class="f">⏳ ${r.deferred}</i>
        <i>• ${r.pending} متبقي</i>
      </div>
    </div>`).join("");
  strip.querySelectorAll(".regcard").forEach(el=>{
    el.addEventListener("click",()=>{
      $("#fRegion").value = el.dataset.reg;
      syncDistricts();
      state.shown = PAGE;
      refreshStats(); renderList();
      if(state.tab==="map") drawMarkers();
      if(state.tab!=="list"){ go("list"); }
      window.scrollTo({top:0, behavior:"smooth"});
    });
  });
}
function initFilters(){
  const regs=[...new Set(CUSTOMERS.map(c=>c.reg).filter(Boolean))].sort();
  regs.forEach(r=>{const o=document.createElement("option");o.value=r;o.textContent=r;$("#fRegion").appendChild(o);});
  syncDistricts();
}

/* districts shown depend on the region picked */
function syncDistricts(){
  const rf=$("#fRegion").value;
  const keep=$("#fDistrict").value;
  const pool=CUSTOMERS.filter(c=>!rf || c.reg===rf);
  const dists=[...new Set(pool.map(c=>c.dist).filter(Boolean))].sort();
  const sel=$("#fDistrict");
  sel.innerHTML='<option value="">كل الديستريكت</option>';
  dists.forEach(d=>{const o=document.createElement("option");o.value=d;o.textContent=d;sel.appendChild(o);});
  sel.value = dists.includes(keep) ? keep : "";
}

function filtered(){
  const q=$("#q").value.trim().toLowerCase();
  const rf=$("#fRegion").value, df=$("#fDistrict").value;
  const sf=$("#fStatus").value, lf=$("#fLoc").value;
  return CUSTOMERS.filter(c=>{
    if(rf && c.reg!==rf) return false;
    if(df && c.dist!==df) return false;
    if(sf && statusOf(c)!==sf) return false;
    if(lf==="has" && !coordsOf(c)) return false;
    if(lf==="no" && coordsOf(c)) return false;
    if(q){
      const hay=`${c.n||""} ${c.c||""} ${c.addr||""} ${c.reg||""} ${c.dist||""}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ===== store list ===== */
function renderList(){
  const all=filtered();
  const list=all.slice(0,state.shown);
  const wrap=$("#storeList");
  wrap.innerHTML="";
  if(!list.length){
    wrap.innerHTML='<div class="empty">مفيش محلات مطابقة للبحث</div>';
    $("#moreNote").textContent="";
    return;
  }
  list.forEach(c=>{
    const st=statusOf(c);
    const done=st==="done";
    const sv=state.surveys.get(c.c);
    const loc=coordsOf(c);
    const el=document.createElement("div");
    el.className="store";

    const chips=[];
    if(done){
      chips.push('<span class="chip ok">✔ تم السيرفي</span>');
      const a=sv.answers||{};
      if(a.storeSize) chips.push(`<span class="chip info">${a.storeSize}</span>`);
      if(a.homeShelf==="نعم") chips.push('<span class="chip ok">هوم شيلف</span>');
      else if(a.homeShelf==="لا") chips.push('<span class="chip no">لا يوجد شيلف</span>');
      if(a.standExists==="نعم") chips.push(`<span class="chip ok">إستاند ${a.standCount||""}</span>`);
      if(a.acceptsCoordination==="لا") chips.push('<span class="chip warn">⚠ رافض التنسيق</span>');
      else if(a.acceptsCoordination==="نعم") chips.push('<span class="chip ok">يقبل التنسيق</span>');
      if(a.hasDelivery==="نعم") chips.push('<span class="chip info">دليفري</span>');
    }else if(st==="deferred"){
      chips.push('<span class="chip amber">⏳ زيارة مؤجلة</span>');
      if(sv && sv.deferReason) chips.push(`<span class="chip warn">${sv.deferReason}</span>`);
    }else{
      chips.push('<span class="chip no">لم يُسجل</span>');
    }
    if(loc && loc.source==="captured") chips.push('<span class="chip info">📌 موقع مسجل</span>');

    const addrTxt = (c.addr && c.addr!=="#N/A") ? c.addr : "العنوان غير متاح";
    const gp = loc
      ? `<a class="gp" href="https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}&travelmode=driving" target="_blank" rel="noopener" title="اتجاهات">📍</a>`
      : `<span class="nogp" title="لا يوجد موقع">⚲</span>`;

    el.innerHTML=`
      <div class="row1">
        <span class="tag-dist">${c.reg||"—"}</span>
        <div class="name">${c.n||"—"}</div>
      </div>
      <div class="addr">${gp}<span class="txt">${addrTxt}</span></div>
      <div class="meta"><b>Code:</b> ${c.c} &nbsp;•&nbsp; 🏢 ${c.dist||"—"}</div>
      <div class="chips">${chips.join("")}</div>
      ${sv && sv.updatedAt ? `<div class="stamp">🕐 ${fmtDate(sv.updatedAt)} — ${sv.repName||""}</div>` : ""}
    `;
    // don't hijack the map link
    el.addEventListener("click",(e)=>{ if(e.target.closest("a.gp")) return; openEntry(c); });
    wrap.appendChild(el);
  });

  $("#moreNote").textContent = all.length>state.shown
    ? `عرض ${state.shown} من ${all.length} — انزل تحت لعرض المزيد`
    : `${all.length} محل`;
}

/* infinite scroll */
window.addEventListener("scroll",()=>{
  if(state.tab!=="list") return;
  if(window.innerHeight+window.scrollY >= document.body.offsetHeight-350){
    const total=filtered().length;
    if(state.shown<total){ state.shown+=PAGE; renderList(); }
  }
});

/* ===== entry ===== */
async function openEntry(cust){
  state.selected=cust; state.answers={}; state.editing=false;
  state.coords = coordsOf(cust);

  const cached = state.surveys.get(cust.c);
  if(cached){
    state.answers={...(cached.answers||{})};
    state.editing=true;
  }else{
    try{
      const snap=await getDoc(doc(db,COLL,cust.c));
      if(snap.exists()){
        const d=snap.data();
        state.answers={...(d.answers||{})};
        state.editing=true;
        if(d.capturedLat&&d.capturedLng) state.coords={lat:d.capturedLat,lng:d.capturedLng,source:"captured"};
      }
    }catch(e){}
  }

  $("#eName").textContent=cust.n||"—";
  $("#eMeta").textContent=`#${cust.c} • ${cust.reg||""}${cust.dist? " • "+cust.dist:""}`;
  $("#saveBtn").textContent = state.editing ? "تحديث السيرفي" : "حفظ السيرفي";
  renderForm(); renderLoc(); syncDeleteBtn();
  go("entry"); window.scrollTo(0,0);
}

function visible(f){ return f.showIf ? f.showIf(state.answers) : true; }
function required(f){ return visible(f) && (f.requiredIf ? f.requiredIf(state.answers) : true); }
function filled(f){ const v=state.answers[f.id]; return v!==undefined&&v!==null&&String(v).trim()!==""; }

function setA(id,v){ state.answers[id]=v; renderForm(); }

function renderForm(){
  const w=$("#qWrap"); w.innerHTML="";
  FIELDS.forEach(f=>{
    if(!visible(f)) return;
    const card=document.createElement("div"); card.className="q";
    const lab=document.createElement("div"); lab.className="lab";
    lab.innerHTML=`<span>${f.label}</span>${required(f)?'<span class="star">*</span>':''}`;
    card.appendChild(lab);

    if(f.type==="yesno"){
      const seg=document.createElement("div"); seg.className="seg";
      ["نعم","لا"].forEach(o=>{
        const b=document.createElement("button"); b.type="button"; b.textContent=o;
        b.className=(o==="نعم"?"yes":"no")+(state.answers[f.id]===o?" on":"");
        b.addEventListener("click",()=>setA(f.id,o));
        seg.appendChild(b);
      });
      card.appendChild(seg);
    }else if(f.type==="select"){
      const g=document.createElement("div"); g.className="pills";
      f.options.forEach(o=>{
        const b=document.createElement("button"); b.type="button"; b.textContent=o;
        if(state.answers[f.id]===o) b.className="on";
        b.addEventListener("click",()=>setA(f.id,o));
        g.appendChild(b);
      });
      card.appendChild(g);
    }else if(f.type==="textarea"){
      const t=document.createElement("textarea");
      t.placeholder="اكتب ملاحظاتك هنا (اختياري)";
      t.value=state.answers[f.id]||"";
      t.addEventListener("input",e=>{state.answers[f.id]=e.target.value; updateProg();});
      card.appendChild(t);
    }else{
      const i=document.createElement("input");
      i.type = f.type==="number"?"number":(f.type==="url"?"url":"text");
      if(f.type==="number") i.min="0";
      if(f.type==="url") i.placeholder="https://...";
      i.value=state.answers[f.id]||"";
      i.addEventListener("input",e=>{state.answers[f.id]=e.target.value; updateProg();});
      card.appendChild(i);
    }
    w.appendChild(card);
  });
  updateProg();
}

function updateProg(){
  const req=FIELDS.filter(required);
  const done=req.filter(filled).length;
  const pct=req.length? Math.round(done/req.length*100):100;
  $("#eFill").style.width=pct+"%";
  $("#eText").textContent=`${done} / ${req.length}`;
  $("#ePct").textContent=pct+"%";
  $("#saveBtn").disabled = done<req.length;
}

/* ===== location ===== */
function renderLoc(){
  const row=$("#locRow"), note=$("#locNote");
  row.innerHTML=""; note.textContent="";
  if(state.coords){
    const {lat,lng,source}=state.coords;
    const a=document.createElement("a");
    a.className="locbtn go"; a.target="_blank"; a.rel="noopener";
    a.href=`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
    a.innerHTML="🧭 اتجاهات للمحل"; row.appendChild(a);
    const b=document.createElement("a");
    b.className="locbtn"; b.target="_blank"; b.rel="noopener";
    b.href=`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
    b.innerHTML="📍 على الخريطة"; row.appendChild(b);
    note.textContent = source==="captured" ? "الموقع اتسجل من مندوب قبل كده" : `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  }else{
    const c=document.createElement("button");
    c.className="locbtn cap"; c.type="button"; c.id="capBtn";
    c.innerHTML="📌 سجّل موقع المحل من مكانك";
    c.addEventListener("click",capture); row.appendChild(c);
    note.textContent="المحل ده مالوش إحداثيات — لو انت واقف عنده سجّل موقعه";
  }
}
function capture(){
  const b=$("#capBtn");
  if(!navigator.geolocation){ toast("المتصفح مش بيدعم تحديد الموقع"); return; }
  b.disabled=true; b.innerHTML="⏳ بيحدد موقعك...";
  navigator.geolocation.getCurrentPosition(
    p=>{ state.coords={lat:p.coords.latitude,lng:p.coords.longitude,source:"captured"};
         toast("✅ اتسجل الموقع"); renderLoc(); },
    e=>{ b.disabled=false; b.innerHTML="📌 سجّل موقع المحل من مكانك";
         toast(e.code===1 ? "لازم تسمح بالوصول لموقعك" : "متعذر تحديد الموقع"); },
    {enableHighAccuracy:true,timeout:12000,maximumAge:0}
  );
}

/* ===== save ===== */
async function save(){
  const req=FIELDS.filter(required);
  if(req.some(f=>!filled(f))){ toast("فيه حقول لسه ناقصة"); return; }
  const b=$("#saveBtn"); b.disabled=true; const old=b.textContent; b.textContent="⏳ جاري الحفظ...";
  const c=state.selected;
  const payload={
    customerCode:c.c, customerName:c.n, region:c.reg, district:c.dist, address:c.addr,
    lat:c.lat??null, lng:c.lng??null,
    answers:{...state.answers},
    status:"done",
    deferReason:null,
    repName:state.repName, repUid:state.user.uid,
    updatedAt:serverTimestamp(),
    ...(state.coords&&state.coords.source==="captured"
      ? {capturedLat:state.coords.lat, capturedLng:state.coords.lng} : {}),
    ...(state.editing?{}:{createdAt:serverTimestamp()}),
  };
  try{
    await setDoc(doc(db,COLL,c.c),payload,{merge:true});
    state.surveys.set(c.c,{...payload, updatedAt:new Date()});
    toast(state.editing?"✅ تم تحديث السيرفي":"✅ تم حفظ السيرفي");
    refreshStats(); renderList(); go("list"); window.scrollTo(0,0);
  }catch(e){ console.error(e); toast("❌ حصل خطأ فى الحفظ"); }
  finally{ b.textContent=old; updateProg(); }
}

/* ===== defer a visit ===== */
let pendingReason = null;

function openDeferSheet(){
  pendingReason = (state.surveys.get(state.selected.c)||{}).deferReason || null;
  const box=$("#deferReasons");
  box.innerHTML="";
  DEFER_REASONS.forEach(r=>{
    const b=document.createElement("button");
    b.type="button"; b.textContent=r;
    if(pendingReason===r) b.className="on";
    b.addEventListener("click",()=>{
      pendingReason=r;
      box.querySelectorAll("button").forEach(x=>x.className="");
      b.className="on";
      $("#deferOk").disabled=false;
    });
    box.appendChild(b);
  });
  $("#deferOk").disabled = !pendingReason;
  $("#deferSheet").classList.remove("hidden");
}
function closeDeferSheet(){ $("#deferSheet").classList.add("hidden"); }

async function confirmDefer(){
  if(!pendingReason) return;
  const b=$("#deferOk"); b.disabled=true; b.textContent="⏳ جاري الحفظ...";
  const c=state.selected;
  const payload={
    customerCode:c.c, customerName:c.n, region:c.reg, district:c.dist, address:c.addr,
    lat:c.lat??null, lng:c.lng??null,
    status:"deferred",
    deferReason:pendingReason,
    answers:{...state.answers},   // keep whatever was filled so far
    repName:state.repName, repUid:state.user.uid,
    updatedAt:serverTimestamp(),
    ...(state.coords&&state.coords.source==="captured"
      ? {capturedLat:state.coords.lat, capturedLng:state.coords.lng} : {}),
    ...(state.editing?{}:{createdAt:serverTimestamp()}),
  };
  try{
    await setDoc(doc(db,COLL,c.c),payload,{merge:true});
    state.surveys.set(c.c,{...payload, updatedAt:new Date()});
    toast("⏳ اتأجلت الزيارة");
    closeDeferSheet();
    refreshStats(); renderList(); go("list"); window.scrollTo(0,0);
  }catch(e){ console.error(e); toast("❌ حصل خطأ فى الحفظ"); }
  finally{ b.textContent="تأكيد التأجيل"; b.disabled=false; }
}

/* ===== hidden admin mode + delete a visit ===== */
let tapCount = 0, tapTimer = null;
function secretTap(){
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(()=>{ tapCount = 0; }, 1200);
  if(tapCount >= 5){
    tapCount = 0;
    state.admin = !state.admin;
    toast(state.admin ? "🔓 اتفتح وضع المشرف" : "🔒 اتقفل وضع المشرف");
    renderList();
    if(state.tab==="prog") renderProgress();
    if(state.tab==="entry") syncDeleteBtn();
  }
}

function syncDeleteBtn(){
  const saved = state.selected && state.surveys.has(state.selected.c);
  $("#delBtn").classList.toggle("hidden", !(state.admin && saved));
}

function openDelSheet(){
  const c = state.selected;
  const s = state.surveys.get(c.c);
  const label = s && s.status==="deferred" ? "الزيارة المؤجلة" : "السيرفي المسجل";
  $("#delMsg").textContent =
    `هيتمسح ${label} الخاص بـ "${c.n}" نهائيًا، والمحل هيرجع "لم يُسجل". مش هينفع تتراجع.`;
  $("#delSheet").classList.remove("hidden");
}
function closeDelSheet(){ $("#delSheet").classList.add("hidden"); }

async function confirmDelete(){
  const b=$("#delOk"); b.disabled=true; b.textContent="⏳ جاري المسح...";
  const c=state.selected;
  try{
    await deleteDoc(doc(db,COLL,c.c));
    state.surveys.delete(c.c);
    toast("🗑 اتمسحت الزيارة");

}

/* ===== stats ===== */
/* the geographic scope the header counters describe:
   region + district only — deliberately ignores status/search/location filters,
   otherwise the numbers would describe themselves (picking "تم" would always read 100%) */
function scopeList(){
  const rf=$("#fRegion").value, df=$("#fDistrict").value;
  return CUSTOMERS.filter(c=>{
    if(rf && c.reg!==rf) return false;
    if(df && c.dist!==df) return false;
    return true;
  });
}
function scopeLabel(){
  const rf=$("#fRegion").value, df=$("#fDistrict").value;
  if(df) return df;
  if(rf) return rf;
  return "كل المناطق";
}

function refreshStats(){
  const t=tally(scopeList());
  $("#sTotal").textContent=t.total;
  $("#sDone").textContent=t.done;
  $("#sDefer").textContent=t.deferred;
  $("#sLeft").textContent=t.pending;
  $("#topBar").style.width=t.pct+"%";
  const withLoc=scopeList().filter(c=>coordsOf(c)).length;
  $("#brandSub").textContent=`${scopeLabel()} — ${t.pct}% إنجاز • ${withLoc} لوكيشن`;
  renderRegionStrip();
}

async function loadSurveys(){
  try{
    const snap=await getDocs(collection(db,COLL));
    state.surveys=new Map();
    snap.forEach(d=>state.surveys.set(d.id,d.data()));
  }catch(e){ console.error("load surveys:",e); }
  refreshStats(); renderList();
}

/* ===== map ===== */
function buildMap(){
  if(state.map){ setTimeout(()=>state.map.invalidateSize(),80); drawMarkers(); return; }
  state.map=L.map("mapEl",{zoomControl:true}).setView([30.05,31.24],7);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{
    attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:19
  }).addTo(state.map);
  state.markers=L.layerGroup().addTo(state.map);
  drawMarkers();
  setTimeout(()=>state.map.invalidateSize(),120);
}

function drawMarkers(){
  if(!state.markers) return;
  state.markers.clearLayers();
  const list=filtered().map(c=>({c,loc:coordsOf(c)})).filter(x=>x.loc);
  const pts=[];
  list.forEach(({c,loc})=>{
    const st=statusOf(c);
    const color = st==="done" ? "#6E8F4A" : (st==="deferred" ? "#D19A33" : "#C4674F");
    const m=L.circleMarker([loc.lat,loc.lng],{
      radius:6, color:"#FFFFFF", weight:2, opacity:.9, fillColor:color, fillOpacity:.95
    });
    m.bindPopup(`
      <div class="pop-nm">${c.n||"—"}</div>
      <div class="pop-md">#${c.c} • ${c.dist||""}</div>
      <a class="pop-btn g" href="https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}&travelmode=driving" target="_blank" rel="noopener">🧭 اتجاهات</a>
      <a class="pop-btn" href="#" data-code="${c.c}">📝 السيرفي</a>
    `);
    m.on("popupopen",(ev)=>{
      const link=ev.popup.getElement().querySelector('a[data-code]');
      if(link) link.addEventListener("click",(e)=>{
        e.preventDefault();
        const cust=CUSTOMERS.find(x=>x.c===link.dataset.code);
        if(cust){ state.map.closePopup(); openEntry(cust); }
      });
    });
    state.markers.addLayer(m);
    pts.push([loc.lat,loc.lng]);
  });
  $("#mapCount").textContent=`${list.length} محل على الخريطة`;
  if(pts.length) state.map.fitBounds(pts,{padding:[30,30],maxZoom:13});
}

/* ===== progress tab ===== */
function renderProgress(){
  const t=tally(CUSTOMERS);
  const C=2*Math.PI*48;
  const withLoc=CUSTOMERS.filter(c=>coordsOf(c)).length;

  const group=(key)=>{
    const m=new Map();
    CUSTOMERS.forEach(c=>{
      const k=c[key]||"—";
      if(!m.has(k)) m.set(k,[]);
      m.get(k).push(c);
    });
    return [...m.entries()].map(([k,list])=>({k,...tally(list)}))
      .sort((a,b)=>b.total-a.total);
  };

  const rows=(arr)=>arr.map(r=>`
    <div class="pcard">
      <div class="r"><span>${r.pct}%</span><span>${r.k}</span></div>
      <div class="pbar"><div style="width:${r.pct}%"></div></div>
      <div class="n" style="margin-top:7px">
        <span style="color:#6E8F4A">✔ ${r.done} تم</span> &nbsp;•&nbsp;
        <span style="color:#D19A33">⏳ ${r.deferred} مؤجلة</span> &nbsp;•&nbsp;
        ${r.pending} متبقي من ${r.total}
      </div>
    </div>`).join("");

  $("#progBody").innerHTML=`
    ${state.admin?`<div class="admin-flag"><span>🔓 وضع المشرف مفعّل — أزرار المسح ظاهرة</span><button id="adminOff">إيقاف</button></div>`:""}
    <div class="pcard">
      <div class="big-ring">
        <div class="kv">
          <div class="i"><span class="dot" style="background:#6E8F4A"></span><span class="n">${t.done}</span> تم السيرفي</div>
          <div class="i"><span class="dot" style="background:#D19A33"></span><span class="n">${t.deferred}</span> زيارات مؤجلة</div>
          <div class="i"><span class="dot" style="background:#C4674F"></span><span class="n">${t.pending}</span> متبقي</div>
          <div class="i"><span class="dot" style="background:#A97C24"></span><span class="n">${withLoc}</span> عنده لوكيشن</div>
        </div>
        <div class="ring">
          <svg width="112" height="112">
            <circle cx="56" cy="56" r="48" fill="none" stroke="#F0E8D8" stroke-width="10"/>
            <circle cx="56" cy="56" r="48" fill="none" stroke="#6E8F4A" stroke-width="10"
              stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C-(C*t.pct/100)}"/>
          </svg>
          <div class="ctr"><div class="pct">${t.pct}%</div><div class="cap">الإنجاز</div></div>
        </div>
      </div>
    </div>

    <div class="sec-t">تصدير البيانات</div>
    <div class="exp-row">
      <button class="exp-btn main" id="expAll">⬇️ تصدير الشيت كامل</button>
      <button class="exp-btn" id="expDone">✔ المكتمل فقط</button>
    </div>
    <div class="exp-note">ملف Excel فيه شيت البيانات + شيت الملخص حسب المنطقة والديستريكت</div>

    <div class="sec-t">التقدم حسب المنطقة</div>
    ${rows(group("reg"))}
    <div class="sec-t">التقدم حسب الديستريكت</div>
    ${rows(group("dist"))}
  `;

  const ao=$("#adminOff");
  if(ao) ao.addEventListener("click",()=>{ state.admin=false; toast("اتقفل وضع المشرف"); renderProgress(); renderList(); });
  $("#expAll").addEventListener("click",()=>exportSheet(false));
  $("#expDone").addEventListener("click",()=>exportSheet(true));
}

/* ===== export to Excel ===== */
const EXPORT_COLS = [
  ["#",              (c,a,s,i)=>i+1],
  ["Region",         c=>c.reg||""],
  ["District",       c=>c.dist||""],
  ["Customer Code",  c=>c.c||""],
  ["Customers Name", c=>c.n||""],
  ["Address",        c=>(c.addr&&c.addr!=="#N/A")?c.addr:""],
  ["Latitude",       (c,a,s)=>{const l=exportCoords(c,s); return l?l.lat:"";}],
  ["Longitude",      (c,a,s)=>{const l=exportCoords(c,s); return l?l.lng:"";}],
  ["Google Maps",    (c,a,s)=>{const l=exportCoords(c,s); return l?`https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lng}`:"";}],
  ["الحالة",                                   (c,a,s)=>({done:"تم السيرفي",deferred:"مؤجلة",pending:"لم يُسجل"})[statusOf(c)]],
  ["سبب التأجيل",                              (c,a,s)=>s&&s.deferReason?s.deferReason:""],
  ["حجم المحل",                                (c,a)=>a.storeSize||""],
  ["هل يوجد هوم شيلف ؟",                      (c,a)=>a.homeShelf||""],
  ["عدد البوكسات / الأرفف فى المحل",          (c,a)=>a.shelfCount??""],
  ["هل يوجد إستاند ؟",                        (c,a)=>a.standExists||""],
  ["عدد الإستاند",                             (c,a)=>a.standCount??""],
  ["اسم الشركة اللى منزلة إستاند",             (c,a)=>a.standCompany||""],
  ["هل يوجد يافطة شركات ؟",                   (c,a)=>a.signExists||""],
  ["اسم الشركة المركبة ليافطة الدعايا",        (c,a)=>a.signCompany||""],
  ["هل يوجد تاندة شركات ؟",                   (c,a)=>a.canopyExists||""],
  ["اسم الشركة المركبة تاندة الدعايا",         (c,a)=>a.canopyCompany||""],
  ["نوع المنطقة",                              (c,a)=>a.areaType||""],
  ["نوع لوكيشن المحل",                         (c,a)=>a.locationType||""],
  ["شوال أو حافظة لبيع منتجات التوابل السائلة",(c,a)=>a.sackExists||""],
  ["اسم الشركة اللى عاملة الشوال أو الحافظة",  (c,a)=>a.sackCompany||""],
  ["هل يقبل التنسيق",                          (c,a)=>a.acceptsCoordination||""],
  ["هل عنده صفحة على السوشيال ميديا",          (c,a)=>a.hasSocial||""],
  ["لينك الصفحة",                              (c,a)=>a.socialLink||""],
  ["هل يوجد دليفرى",                           (c,a)=>a.hasDelivery||""],
  ["ملاحظات أخرى",                             (c,a)=>a.notes||""],
  ["اسم المندوب",                              (c,a,s)=>s&&s.repName?s.repName:""],
  ["تاريخ التسجيل",                            (c,a,s)=>s&&s.updatedAt?fmtDate(s.updatedAt):""],
];

function exportCoords(c,s){
  if(s && s.capturedLat && s.capturedLng) return {lat:s.capturedLat,lng:s.capturedLng};
  if(hasCoords(c)) return {lat:c.lat,lng:c.lng};
  return null;
}

function exportSheet(onlyDone){
  if(typeof XLSX==="undefined"){ toast("مكتبة التصدير لسه بتحمّل، حاول تاني"); return; }
  const src = onlyDone ? CUSTOMERS.filter(c=>statusOf(c)!=="pending") : CUSTOMERS;
  if(!src.length){ toast("مفيش بيانات للتصدير"); return; }

  const header = EXPORT_COLS.map(x=>x[0]);
  const body = src.map((c,i)=>{
    const s = state.surveys.get(c.c) || null;
    const a = (s && s.answers) ? s.answers : {};
    return EXPORT_COLS.map(([,fn])=>fn(c,a,s,i));
  });

  const wb = XLSX.utils.book_new();
  wb.Workbook = { Views:[{RTL:true}] };

  const ws = XLSX.utils.aoa_to_sheet([header, ...body]);
  ws["!cols"] = header.map(h=>({wch: Math.min(Math.max(h.length+4,12),42)}));
  ws["!freeze"] = { xSplit:0, ySplit:1 };
  // keep customer codes as text so leading zeros survive
  const codeCol = header.indexOf("Customer Code");
  for(let r=1;r<=body.length;r++){
    const ref = XLSX.utils.encode_cell({r, c:codeCol});
    if(ws[ref]) ws[ref].t = "s";
  }
  XLSX.utils.book_append_sheet(wb, ws, "Survey");

  // summary sheet
  const sum = [["المستوى","الاسم","إجمالي","تم السيرفي","مؤجلة","متبقي","نسبة الإنجاز"]];
  const t = tally(CUSTOMERS);
  sum.push(["الإجمالي","كل المحلات",t.total,t.done,t.deferred,t.pending,t.pct+"%"]);
  const grp=(key,label)=>{
    const m=new Map();
    CUSTOMERS.forEach(c=>{ const k=c[key]||"—"; if(!m.has(k)) m.set(k,[]); m.get(k).push(c); });
    [...m.entries()].sort((a,b)=>b[1].length-a[1].length).forEach(([k,list])=>{
      const x=tally(list);
      sum.push([label,k,x.total,x.done,x.deferred,x.pending,x.pct+"%"]);
    });
  };
  grp("reg","منطقة"); grp("dist","ديستريكت");
  const ws2 = XLSX.utils.aoa_to_sheet(sum);
  ws2["!cols"] = [{wch:12},{wch:30},{wch:10},{wch:12},{wch:10},{wch:10},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws2, "Summary");

  const d = new Date();
  const stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  XLSX.writeFile(wb, `Ettara_Survey_${onlyDone?"Completed_":""}${stamp}.xlsx`);
  toast(`⬇️ تم تصدير ${src.length} محل`);
}

/* ===== tabs ===== */
function go(tab){
  state.tab=tab;
  ["list","map","prog","entry"].forEach(t=>$("#t-"+t).classList.toggle("hidden",t!==tab));
  if(tab!=="entry"){ closeDeferSheet(); closeDelSheet(); }
  $("#topbar").classList.toggle("hidden",tab==="entry");
  $("#nav").classList.toggle("hidden",tab==="entry");
  $$("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  if(tab==="map") buildMap();
  if(tab==="prog") renderProgress();
}

/* ===== identity ===== */
function showGate(){
  $("#main").classList.add("hidden");
  $("#gate").classList.remove("hidden");
  $("#nav").classList.add("hidden");
  $("#nameInput").value=localStorage.getItem(NAME_KEY)||"";
}
function enter(){
  $("#gate").classList.add("hidden");
  $("#main").classList.remove("hidden");
  $("#nav").classList.remove("hidden");
  $("#whoBtn").textContent=state.repName;
  go("list");
  loadSurveys();
}

$("#gateBtn").addEventListener("click",()=>{
  const n=$("#nameInput").value.trim();
  $("#gate-err").textContent="";
  if(!n){ $("#gate-err").textContent="من فضلك اكتب اسمك"; return; }
  if(!state.user){ $("#gate-err").textContent="لسه بيتم الاتصال، حاول تاني بعد لحظة"; return; }
  localStorage.setItem(NAME_KEY,n); state.repName=n; enter();
});
$("#whoBtn").addEventListener("click",()=>{
  localStorage.removeItem(NAME_KEY); state.repName=null; showGate();
});

onAuthStateChanged(auth,(u)=>{
  $("#boot").classList.add("hidden");
  $("#app").classList.remove("hidden");
  if(u){
    state.user=u;
    const n=localStorage.getItem(NAME_KEY);
    if(n){ state.repName=n; enter(); } else showGate();
  }else showGate();
});
signInAnonymously(auth).catch(e=>{
  console.error(e);
  $("#boot").classList.add("hidden");
  $("#app").classList.remove("hidden");
  showGate();
  $("#gate-err").textContent="تعذر الاتصال. اتأكد إن Anonymous Auth مفعّل فى Firebase.";
});
setTimeout(()=>{
  $("#boot").classList.add("hidden");
  $("#app").classList.remove("hidden");
  if($("#gate").classList.contains("hidden") && $("#main").classList.contains("hidden")) showGate();
},4500);

/* ===== wiring ===== */
initFilters();
refreshStats();
renderList();
const reset=()=>{ state.shown=PAGE; refreshStats(); renderList(); if(state.tab==="map") drawMarkers(); };
$("#q").addEventListener("input",()=>{ state.shown=PAGE; renderList(); if(state.tab==="map") drawMarkers(); });
$("#fRegion").addEventListener("change",()=>{ syncDistricts(); reset(); });
$("#fDistrict").addEventListener("change",reset);
$("#fStatus").addEventListener("change",reset);
$("#fLoc").addEventListener("change",reset);
$("#cancelBtn").addEventListener("click",()=>go("list"));
$("#saveBtn").addEventListener("click",save);
$("#deferBtn").addEventListener("click",openDeferSheet);
$("#deferCancel").addEventListener("click",closeDeferSheet);
$("#deferOk").addEventListener("click",confirmDefer);
$("#deferSheet").addEventListener("click",(e)=>{ if(e.target.id==="deferSheet") closeDeferSheet(); });
$("#delBtn").addEventListener("click",openDelSheet);
$("#delCancel").addEventListener("click",closeDelSheet);
$("#delOk").addEventListener("click",confirmDelete);
$("#delSheet").addEventListener("click",(e)=>{ if(e.target.id==="delSheet") closeDelSheet(); });
$("#brandSub").addEventListener("click",secretTap);
$$("#nav button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.t)));
</script>
